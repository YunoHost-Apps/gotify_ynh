#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gotify"
name = "Gotify"
description.en = "Simple server for sending and receiving messages"
description.fr = "Simple serveur pour envoyer et recevoir des messages"

version = "3.0.0~ynh1"

maintainers = ["plopoyop"]

[upstream]
license = "MIT"
website = "http://gotify.net"
admindoc = "https://gotify.net/docs/index"
code = "https://github.com/gotify/server"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gotify"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]
    [resources.sources.main]
    in_subdir = false
    armhf.url = "https://github.com/gotify/server/releases/download/v3.0.0/gotify-linux-arm-7.zip"
    armhf.sha256 = "7f66df9c941e300006f2b37abca6703747ad4c322b2cb47686c89fa658bc94e1"
    arm64.url = "https://github.com/gotify/server/releases/download/v3.0.0/gotify-linux-arm64.zip"
    arm64.sha256 = "abdb55509a8f3844c866a135a3858d579388a7c4b23f5676a1f6c4d8e8ddb227"
    amd64.url = "https://github.com/gotify/server/releases/download/v3.0.0/gotify-linux-amd64.zip"
    amd64.sha256 = "b21c83f19fcc5715e5427f11797207ceddc345bebc1b5342aaf143967a979534"
    i386.url = "https://github.com/gotify/server/releases/download/v3.0.0/gotify-linux-386.zip"
    i386.sha256 = "264da9aa569574e879a8a3a9a350fd3b001edb8095a3972f9151e54d72db8081"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.armhf = "gotify-linux-arm-7.zip"
    autoupdate.asset.arm64 = "gotify-linux-arm64.zip"
    autoupdate.asset.amd64 = "gotify-linux-amd64.zip"
    autoupdate.asset.i386 = "gotify-linux-386.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["images", "plugins"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
