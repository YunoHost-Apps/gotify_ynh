#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gotify"
name = "Gotify"
description.en = "Simple server for sending and receiving messages"
description.fr = "Simple serveur pour envoyer et recevoir des messages"

version = "3.1.1~ynh1"

maintainers = ["plopoyop"]

[upstream]
license = "MIT"
website = "http://gotify.net"
admindoc = "https://gotify.net/docs/index"
code = "https://github.com/gotify/server"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gotify"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]
    [resources.sources.main]
    in_subdir = false
    armhf.url = "https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-arm-7.zip"
    armhf.sha256 = "5c9b9323a72af163cff50a61597f8f0724d4ab7bbe26ca0ff3b5a74ff3af94e1"
    arm64.url = "https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-arm64.zip"
    arm64.sha256 = "742ca7e0dd63b0902b7fb01552bd37f4df4d3bb66ced583144faff90a3e76901"
    amd64.url = "https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-amd64.zip"
    amd64.sha256 = "d452faad071981d191d5c95f70d0f9520dc2ef2336b2b03055e12cfabfbae2d2"
    i386.url = "https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-386.zip"
    i386.sha256 = "8da97485bff9902cecda851053dd0a78e72df5954c1d67d57f1e90fef33025dc"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.armhf = "gotify-linux-arm-7.zip"
    autoupdate.asset.arm64 = "gotify-linux-arm64.zip"
    autoupdate.asset.amd64 = "gotify-linux-amd64.zip"
    autoupdate.asset.i386 = "gotify-linux-386.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["images", "plugins"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
