#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gotify"
name = "Gotify"
description.en = "Simple server for sending and receiving messages"
description.fr = "Simple serveur pour envoyer et recevoir des messages"

version = "3.1.0~ynh1"

maintainers = ["plopoyop"]

[upstream]
license = "MIT"
website = "http://gotify.net"
admindoc = "https://gotify.net/docs/index"
code = "https://github.com/gotify/server"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gotify"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]
    [resources.sources.main]
    in_subdir = false
    armhf.url = "https://github.com/gotify/server/releases/download/v3.1.0/gotify-linux-arm-7.zip"
    armhf.sha256 = "cb6e45da9af2be179f16e8d7c61b7ef89f5f9fc5a5284455c985f32c7017ee65"
    arm64.url = "https://github.com/gotify/server/releases/download/v3.1.0/gotify-linux-arm64.zip"
    arm64.sha256 = "69d8e6b9c56ba561ff400cc4cb2c588993c32ef7ea8e37a019161daf256dd40e"
    amd64.url = "https://github.com/gotify/server/releases/download/v3.1.0/gotify-linux-amd64.zip"
    amd64.sha256 = "01c4869f1cf874634416959f7aab45f7eab53597e018479fcf3ce76ae8465c75"
    i386.url = "https://github.com/gotify/server/releases/download/v3.1.0/gotify-linux-386.zip"
    i386.sha256 = "11a847980781efb98b3e96e273a133cf87c46296850a5b1fc7fabc58f4f30e86"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.armhf = "gotify-linux-arm-7.zip"
    autoupdate.asset.arm64 = "gotify-linux-arm64.zip"
    autoupdate.asset.amd64 = "gotify-linux-amd64.zip"
    autoupdate.asset.i386 = "gotify-linux-386.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["images", "plugins"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
